<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vin Salta</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Iconos -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>
<body>

  <main class="landing">

    <section class="profile">
      <img src="img/perfil.jpg" alt="Vin Salta" class="profile-img" />

      <h1>Vin_Salta</h1>

      <p class="location">
        Salta - Argentina 🌻 🌿
      </p>

      <p class="bio">
        La belleza de lo simple, la<br />
        perfección en los detalles...
      </p>

      <div class="socials">
        <a href="https://instagram.com/" target="_blank" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="https://tiktok.com/" target="_blank" aria-label="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>

        <a href="https://facebook.com/" target="_blank" aria-label="Facebook">
          <i class="fa-brands fa-facebook"></i>
        </a>
      </div>
    </section>

    <section class="links">

      <a href="#" class="link-card">
        <img src="img/telegram.jpg" alt="" />
        <span>Telegram Gratuito 💖</span>
        <i class="fa-solid fa-ellipsis-vertical menu-icon"></i>
      </a>

      <a href="#" class="link-card">
        <img src="img/cafe.jpg" alt="" />
        <span>Cafecito ☕ Explícito</span>
        <i class="fa-solid fa-ellipsis-vertical menu-icon"></i>
      </a>

      <a href="#" class="link-card">
        <img src="img/tiktok.jpg" alt="" />
        <span>TikTok</span>
        <i class="fa-solid fa-ellipsis-vertical menu-icon"></i>
      </a>

      <a href="#" class="link-card">
        <img src="img/facebook.jpg" alt="" />
        <span>Facebook</span>
        <i class="fa-solid fa-ellipsis-vertical menu-icon"></i>
      </a>

      <a href="#" class="link-card">
        <img src="img/tarifas.jpg" alt="" />
        <span>Tarifas</span>
        <i class="fa-solid fa-ellipsis-vertical menu-icon"></i>
      </a>

    </section>

  </main>

</body>
</html>
