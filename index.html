    <div class="age-gate" id="ageGate" hidden>
      <div
        class="age-gate__card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="ageGateTitle"
        aria-describedby="ageGateText"
      >
        <p class="age-gate__eyebrow">Contenido para adultos</p>
        <h2 id="ageGateTitle">&iquest;Sos mayor de 18 a&ntilde;os?</h2>
        <p id="ageGateText">
          Para continuar a este enlace, confirm&aacute; que ten&eacute;s 18
          a&ntilde;os o m&aacute;s.
        </p>
        <div class="age-gate__actions">
          <button
            class="age-gate__button age-gate__button--primary"
            type="button"
            data-age-confirm
          >
            S&iacute;, continuar
          </button>
          <button class="age-gate__button" type="button" data-age-cancel>
            No, volver
          </button>
        </div>
      </div>
    </div>

    <script>
      const ageGate = document.querySelector("#ageGate");
      const ageConfirm = document.querySelector("[data-age-confirm]");
      const ageCancel = document.querySelector("[data-age-cancel]");
      const ageTitle = document.querySelector("#ageGateTitle");
      let pendingUrl = "";
      let lastFocusedLink = null;

      function openAgeGate(link) {
        pendingUrl = link.href;
        lastFocusedLink = link;
        ageTitle.textContent = "\u00bfSos mayor de 18 a\u00f1os?";
        ageGate.hidden = false;
        document.body.classList.add("is-gate-open");
        ageConfirm.focus();
      }

      function closeAgeGate() {
        pendingUrl = "";
        ageGate.hidden = true;
        document.body.classList.remove("is-gate-open");
        if (lastFocusedLink) {
          lastFocusedLink.focus();
        }
      }

      document.querySelectorAll("[data-age-gate]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          openAgeGate(link);
        });
      });

      ageConfirm.addEventListener("click", () => {
        if (pendingUrl) {
          window.open(pendingUrl, "_blank", "noopener,noreferrer");
        }
        closeAgeGate();
      });

      ageCancel.addEventListener("click", closeAgeGate);

      ageGate.addEventListener("click", (event) => {
        if (event.target === ageGate) {
          closeAgeGate();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !ageGate.hidden) {
          closeAgeGate();
        }
      });
    </script>
